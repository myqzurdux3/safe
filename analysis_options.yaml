# Configuration de l'analyseur Dart.
#
# `flutter analyze` doit finir par « No issues found! »; c'est une condition de
# la vérification continue, pas une indication.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Dart interdit les paramètres nommés privés: un champ privé alimenté par un
    # paramètre nommé public ne peut pas devenir un « initializing formal ».
    prefer_initializing_formals: false
    prefer_final_locals: true
    # Aucun `print` dans une application qui manipule des secrets.
    avoid_print: true
    prefer_single_quotes: true
