name: safe
description: "Coffre clef/valeur chiffré, hors ligne, pour Android et Linux."
# Application, pas paquet: rien à publier sur pub.dev.
publish_to: 'none'

# versionName + versionCode côté Android.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  share_plus: ^13.3.0
  sodium: ^4.0.4
  # Normalisation Unicode: le SDK n'en fournit aucune, et sans elle deux
  # écritures d'une même clef accentuée font deux entrées indistinguables.
  unorm_dart: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Règles de lint; affinées dans analysis_options.yaml.
  flutter_lints: ^6.0.0
  file_selector_platform_interface: ^2.7.0
  share_plus_platform_interface: ^7.2.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    # Icône de la fenêtre sous Linux, chargée par le lanceur natif.
    - assets/icon/safe_256.png
