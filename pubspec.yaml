name: safe
description: "Coffre clef/valeur chiffré, hors ligne, pour Android et Linux."
# Application, pas paquet: rien à publier sur pub.dev.
publish_to: 'none'

# versionName + versionCode côté Android.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Fourni par flutter_localizations; `any` évite d'épingler une version que le
  # SDK contredirait à la prochaine mise à jour.
  intl: any
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  share_plus: ^13.3.0
  sodium: ^4.0.4
  # Normalisation Unicode: le SDK n'en fournit aucune, et sans elle deux
  # écritures d'une même clef accentuée font deux entrées indistinguables.
  unorm_dart: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Règles de lint; affinées dans analysis_options.yaml.
  flutter_lints: ^6.0.0
  file_selector_platform_interface: ^2.7.0
  share_plus_platform_interface: ^7.2.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  # Génère `AppLocalizations` depuis lib/l10n/*.arb (voir l10n.yaml).
  generate: true

  assets:
    # Icône de la fenêtre sous Linux, chargée par le lanceur natif.
    - assets/icon/safe_256.png
    - assets/fonts/OFL-InstrumentSans.txt
    - assets/fonts/OFL-JetBrainsMono.txt

  fonts:
    # Interface. Embarquées plutôt que chargées depuis Google: l'application est
    # hors ligne et ne doit contacter personne au démarrage.
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
    # Tout ce qui est une donnée stockée s'affiche en chasse fixe, jamais en
    # linéale: une valeur doit se relire caractère par caractère.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
