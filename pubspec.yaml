name: safe
description: "Coffre clef/valeur chiffré, hors ligne, pour Android et Linux."
# Application privée: jamais publiée sur pub.dev.
publish_to: 'none'

# versionName + versionCode côté Android.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  share_plus: ^13.3.0
  sodium: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Règles de lint; affinées dans analysis_options.yaml.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Icône de la fenêtre sous Linux, chargée par le lanceur natif.
    - assets/icon/safe_256.png
